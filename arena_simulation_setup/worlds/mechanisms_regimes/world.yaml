format: arena-world/2
schedules:
- name: rush_hour
  semantics:
  - {preset: schedule, params: {windows: [], regime: rush}}
- name: fire_alarm
  semantics:
  - {preset: schedule, params: {windows: [], regime: alarm}}
signals:
- name: xwalk_signal
  semantics:
  - preset: signal
    params:
      phases:
      - {name: stop, duration: 12.0}
      - {name: go, duration: 15.0}
      stop_phases: [stop]
      position: [11.0, 6.0]
      radius: 1.5
