format: arena-scenario/2
robots:
- start: [2.0, 3.75, 0.0]
  phases:
  - {goto: [14.0, 3.75, 0.0]}
conditions:
- {op: eventually, p: robot in slidingtop_b, text: Reach the far side of the door.}
- op: never_during
  p: robot in slidingtop_gap
