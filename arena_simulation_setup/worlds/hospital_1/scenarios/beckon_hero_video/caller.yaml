# Aimed at the junction point the robot turns through
name: caller
mode: behavior_tree
extends: adult
initial_sequence: call_seq
sequences:
  call_seq:
    steps:
      call:
        attention:
          clip: beckon_v3
          gaze: {x: 12.2, y: 11.3, z: 0.4}
        duration: {mean: 1000.0, std: 0.0}
    then: call_seq
