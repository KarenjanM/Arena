format: arena-scenario/2
robots:
- start: [23.0, 9.0, 3.1416]
  phases:
  - {goto: [3.0, 6.0, 3.1416]}
regions:
  burst_source:
    type: source
    polygon:
    - {x: 17.0, y: 7.5}
    - {x: 25.0, y: 7.5}
    - {x: 25.0, y: 11.5}
    - {x: 17.0, y: 11.5}
    config:
      rate_profile:
      - {t: 0.0, rate: 0.0}
      - {t: 4.0, rate: 3.0}
      - {t: 10.0, rate: 0.0}
      max_concurrent: 12
      max_total: 12
      agent: {agent_type: adult, desired_velocity: {min: 1.0, max: 1.4}, sink_affinity: [{sink: burst_sink, weight: 1.0}]}
  burst_sink:
    type: sink
    polygon:
    - {x: 1.0, y: 1.0}
    - {x: 5.0, y: 1.0}
    - {x: 5.0, y: 4.0}
    - {x: 1.0, y: 4.0}
    config: {capacity: -1}
conditions:
- {op: eventually, p: robot in west_hall, text: Reach the far hall.}
- op: never_during
  p: robot in dw_main
  q: main_door/0.state == closing
  text: Never stand in the doorway while the door is closing.
