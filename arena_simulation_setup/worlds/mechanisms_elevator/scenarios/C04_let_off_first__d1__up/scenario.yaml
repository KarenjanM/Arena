format: arena-scenario/2
humans:
- name: arrival_1
  model: casual_female_caucasian_young
  pose: [2.4, 8.0, 1.5708]
  agent: {agent_type: adult}
  waypoints:
  - {x: 2.4, y: 8.0, level: '1'}
  - {x: 10.0, y: 2.0, level: '0'}
  waypoint_mode: once
  level: '1'
robots:
- start: [8.0, 3.0, 1.5708]
  phases:
  - {goto: [8.0, 3.0, -1.5708]}
  level: '0'
  goal_level: '1'
conditions:
- {op: eventually, p: robot in l1_lobby, text: Arrive on the other floor.}
- op: never_during
  p: robot in elev_a_cabin
  q: elev_a/0.just_arrived == true
  text: Never be in the cabin while arrivals are still inside.
