  size_m: [0.07, 0.07, 0.22]
  mass_kg: 0.5
  grip_axis: z
  hands: 1

box:
  size_m: [0.25, 0.30, 0.20]
  mass_kg: 1.0
  grip_axis: y
  hands: 2
