# Paired with a despawn: an arm that cannot succeed measures the timeout, not the robot.

events:
  - action: spawn
    entity: rear_blocker
    model: Office/Object/SM_BookcaseA
    at: {route_fraction: 0.5}
    place: {route_fraction: 0.3}
    note: Behind the robot at the moment it appears, on ground already travelled.

  - action: despawn
    entity: rear_blocker
    at: {t: 60.0}
